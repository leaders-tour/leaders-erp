mutation AnalyzeCatalogRouteObservations($input: CatalogRouteObservationAnalyzeInput) {
  analyzeCatalogRouteObservations(input: $input) {
    scanned
    upserted
    routeCreated
    held
    protectedHold
  }
}

mutation UpdateCatalogRouteObservation($id: ID!, $input: CatalogRouteObservationUpdateInput!) {
  updateCatalogRouteObservation(id: $id, input: $input) {
    id
    includeElapsed
    includeDistance
    manualIncludeOverride
  }
}
