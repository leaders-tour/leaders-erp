query CatalogPlaces {
  catalogPlaces {
    id
    code
    name
    placeType
    otherTypeLabel
    country
    regionId
    region {
      id
      name
    }
    regionIds
    regions {
      id
      name
    }
    parentPlaceId
    parentPlace {
      id
      name
    }
    latitude
    longitude
    status
  }
}

query CatalogRoutes {
  catalogRoutes {
    id
    code
    name
    region {
      id
      name
    }
    fromPlaceId
    fromPlace {
      id
      name
    }
    toPlaceId
    toPlace {
      id
      name
    }
    averageDistanceKm
    averageTravelHours
    estimateMode
    bufferMinutes
    observationCount
    usableCount
    medianElapsedMinutes
    minElapsedMinutes
    maxElapsedMinutes
    medianDistanceKm
    status
  }
}

query CatalogRouteObservations($regionId: ID, $projectId: ID, $routeId: ID) {
  catalogRouteObservations(regionId: $regionId, projectId: $projectId, routeId: $routeId) {
    id
    fromVisitLinkId
    toVisitLinkId
    projectId
    fromPlaceId
    fromPlace {
      id
      name
      code
    }
    toPlaceId
    toPlace {
      id
      name
      code
    }
    routeId
    route {
      id
      code
      name
    }
    departedAt
    arrivedAt
    elapsedMs
    distanceKm
    maxGapMinutes
    includeDistance
    includeElapsed
    manualIncludeOverride
    status
    holdReason
    path {
      lat
      lng
      at
    }
    analyzedAt
  }
}

query CatalogRoute($id: ID!) {
  catalogRoute(id: $id) {
    id
    code
    name
    region {
      id
      name
    }
    fromPlaceId
    fromPlace {
      id
      name
    }
    toPlaceId
    toPlace {
      id
      name
    }
    averageDistanceKm
    averageTravelHours
    estimateMode
    bufferMinutes
    observationCount
    usableCount
    medianElapsedMinutes
    minElapsedMinutes
    maxElapsedMinutes
    medianDistanceKm
    status
  }
}
