query AppSettings {
  appSettings {
    movementIntensityColors {
      level
      color
    }
    rentalItemPresets {
      id
      name
      current
      sharedQuantityRules {
        id
        minHeadcount
        maxHeadcount
        quantity
      }
      items {
        id
        label
        unit
        quantityFormula
      }
    }
    updatedAt
  }
}
