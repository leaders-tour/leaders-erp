query Plans($userId: ID!) {
  plans(userId: $userId) {
    id
    userId
    regionSetId
    title
    documentNumberBase
    currentVersionId
    currentVersion {
      id
      meta {
        id
        planVersionId
        leaderName
      }
    }
  }
}

query PlanVersions($planId: ID!) {
  planVersions(planId: $planId) {
    id
    planId
    parentVersionId
    versionNumber
    variantType
    totalDays
    meta {
      id
      planVersionId
      leaderName
    }
  }
}
