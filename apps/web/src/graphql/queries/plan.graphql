query Plans($userId: ID!) {
  plans(userId: $userId) {
    id
    userId
    regionSetId
    title
    documentNumberBase
    currentVersionId
  }
}

query PlanVersions($planId: ID!) {
  planVersions(planId: $planId) {
    id
    planId
    parentVersionId
    versionNumber
    variantType
    totalDays
  }
}
