type Region {
  id: ID!
  name: String!
  description: String
  alwaysIncludeFirstDayStart: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  locations: [Location!]!
  segments: [Segment!]!
  plans: [Plan!]!
}

input RegionCreateInput {
  name: String!
  description: String
  alwaysIncludeFirstDayStart: Boolean
}

input RegionUpdateInput {
  name: String
  description: String
  alwaysIncludeFirstDayStart: Boolean
}
