enum CalendarNoteKind {
  GUEST_HOUSE
  PICKUP
  DROP
  CAMEL_DOLL
  CUSTOM
  NOMADIC_SHOW
}

type CalendarNote {
  id: ID!
  occursOn: String!
  kind: CalendarNoteKind!
  customText: String
  timeText: String
  headcount: Int
  confirmedTripId: String
  confirmedTrip: ConfirmedTrip
  memo: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CalendarNoteCreateInput {
  occursOn: String!
  kind: CalendarNoteKind!
  customText: String
  timeText: String
  headcount: Int
  confirmedTripId: ID
  memo: String
}

input CalendarNoteUpdateInput {
  occursOn: String
  kind: CalendarNoteKind
  customText: String
  timeText: String
  headcount: Int
  confirmedTripId: ID
  memo: String
}

enum ConfirmedTripStatus {
  ACTIVE
  CANCELLED
}

enum LodgingAssignmentType {
  ACCOMMODATION
  LV1
  LV2
  LV3
  LV4
  NIGHT_TRAIN
  CUSTOM_TEXT
}

enum LodgingBookingStatus {
  PENDING
  REQUESTED
  CONFIRMED
  CANCELLED
}

type LodgingConflictWarning {
  conflictingTripId: String!
  conflictingTripLeaderName: String!
  overlapStartDate: DateTime!
  overlapEndDate: DateTime!
}

"""확정 숙소 배정에 연결된 객실 옵션(복수) 및 옵션별 실수."""
type ConfirmedTripLodgingOption {
  id: ID!
  accommodationOptionId: String!
  roomCount: Int!
  accommodationOption: AccommodationOption!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ConfirmedTripGuideAssignment {
  id: ID!
  confirmedTripId: String!
  guideId: String!
  guide: Guide!
  sortOrder: Int!
  nameSnapshot: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ConfirmedTripDriverAssignment {
  id: ID!
  confirmedTripId: String!
  driverId: String!
  driver: Driver!
  sortOrder: Int!
  nameSnapshot: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ConfirmedTripLodging {
  id: ID!
  confirmedTripId: String!
  dayIndex: Int!
  checkInDate: DateTime!
  checkOutDate: DateTime!
  nights: Int!
  type: LodgingAssignmentType!
  accommodationId: String
  """옵션별 객실 수 합계(ACCOMMODATION 타입은 optionAssignments 기준)."""
  roomCount: Int!
  accommodation: Accommodation
  optionAssignments: [ConfirmedTripLodgingOption!]!
  lodgingNameSnapshot: String!
  bookingStatus: LodgingBookingStatus!
  bookingMemo: String
  bookingReference: String
  conflictWarnings: [LodgingConflictWarning!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ConfirmedTrip {
  id: ID!
  userId: String!
  planId: String
  planVersionId: String
  status: ConfirmedTripStatus!
  confirmedAt: DateTime!
  confirmedByEmployeeId: String

  assignedVehicle: String
  accommodationNote: String
  operationNote: String
  openChatUrl: String

  travelStart: DateTime
  travelEnd: DateTime
  pickupDate: DateTime
  dropDate: DateTime
  destination: String
  paxCount: Int
  rentalGear: Boolean!
  rentalDrone: Boolean!
  rentalStarlink: Boolean!
  rentalPowerbank: Boolean!
  camelDollPurchased: Boolean!
  isRecruitingOpen: Boolean!

  depositAmountKrw: Int
  balanceAmountKrw: Int
  totalAmountKrw: Int
  securityDepositAmountKrw: Int
  groupTotalAmountKrw: Int

  user: User!
  plan: Plan
  planVersion: PlanVersion
  confirmedByEmployee: Employee
  guideAssignments: [ConfirmedTripGuideAssignment!]!
  driverAssignments: [ConfirmedTripDriverAssignment!]!
  lodgings: [ConfirmedTripLodging!]!

  createdAt: DateTime!
  updatedAt: DateTime!
}

input ConfirmTripInput {
  planId: ID!
  planVersionId: ID!
  confirmedByEmployeeId: ID
}

input CreateConfirmedTripDirectInput {
  userId: ID!
  travelStart: DateTime
  travelEnd: DateTime
  destination: String
  paxCount: Int
  totalAmountKrw: Int
  depositAmountKrw: Int
  balanceAmountKrw: Int
  securityDepositAmountKrw: Int
  confirmedByEmployeeId: ID
}

input ConfirmedTripGuideAssignmentInput {
  guideId: ID!
  sortOrder: Int
  nameSnapshot: String
}

input ConfirmedTripDriverAssignmentInput {
  driverId: ID!
  sortOrder: Int
  nameSnapshot: String
}

input ConfirmedTripUpdateInput {
  assignedVehicle: String
  accommodationNote: String
  operationNote: String
  openChatUrl: String
  """예약표 등에 표시되는 확정(예약) 일시. ACTIVE 건만 수정 가능."""
  confirmedAt: DateTime
  """플랜에 연결된 ACTIVE 확정 건만 허용. 동일 plan 소속 버전으로만 변경 가능."""
  planVersionId: ID
  status: ConfirmedTripStatus
  travelStart: DateTime
  travelEnd: DateTime
  pickupDate: DateTime
  dropDate: DateTime
  destination: String
  paxCount: Int
  """통째 교체: 미포함 시 기존 배정 유지. 빈 배열은 해당 역할 배정 전부 삭제."""
  guideAssignments: [ConfirmedTripGuideAssignmentInput!]
  driverAssignments: [ConfirmedTripDriverAssignmentInput!]
  rentalGear: Boolean
  rentalDrone: Boolean
  rentalStarlink: Boolean
  rentalPowerbank: Boolean
  camelDollPurchased: Boolean
  isRecruitingOpen: Boolean
  depositAmountKrw: Int
  balanceAmountKrw: Int
  totalAmountKrw: Int
  securityDepositAmountKrw: Int
  groupTotalAmountKrw: Int
}

input ConfirmedTripLodgingOptionUpsertInput {
  accommodationOptionId: ID!
  roomCount: Int!
}

input ConfirmedTripLodgingUpsertInput {
  id: ID
  confirmedTripId: ID!
  dayIndex: Int!
  checkInDate: DateTime!
  checkOutDate: DateTime!
  type: LodgingAssignmentType!
  accommodationId: String
  """ACCOMMODATION일 때 필수·1개 이상. 그 외 타입은 빈 배열."""
  optionAssignments: [ConfirmedTripLodgingOptionUpsertInput!]
  lodgingNameSnapshot: String!
  pricePerNightKrw: Int
  """ACCOMMODATION 제외 타입만 사용(optionAssignments 미사용). 기본값 1."""
  roomCount: Int
  bookingStatus: LodgingBookingStatus
  bookingMemo: String
  bookingReference: String
}
