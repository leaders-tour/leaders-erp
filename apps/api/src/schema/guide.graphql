enum GuideLevel {
  MAIN
  JUNIOR
  ROOKIE
  OTHER
}

enum GuideStatus {
  ACTIVE_SEASON
  INTERVIEW_DONE
  INACTIVE
  OTHER
}

enum GuideGender {
  MALE
  FEMALE
}

type Guide {
  id: ID!
  nameKo: String!
  nameMn: String
  level: GuideLevel!
  status: GuideStatus!
  gender: GuideGender
  birthYear: Int
  isSmoker: Boolean!
  experienceYears: Int
  joinYear: Int
  phone: String
  profileImageUrl: String
  certImageUrls: [String!]!
  note: String
  leaderstepsAuthUserId: ID
  leaderstepsAuthLinkedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  confirmedTrips(includeCancelled: Boolean): [ConfirmedTrip!]!
}

type LeaderstepsAuthUser {
  id: ID!
  email: String
  phone: String
  displayName: String
  createdAt: DateTime!
  lastSignInAt: DateTime
  linkedGuideId: ID
  linkedGuideNameKo: String
  linkedGuideNameMn: String
}

type GuideLocation {
  guideId: ID!
  guideNameKo: String!
  guideNameMn: String
  profileImageUrl: String
  latitude: Float!
  longitude: Float!
  accuracy: Float!
  recordedAt: DateTime!
  source: String!
  projectId: ID!
}

input GuideCreateInput {
  nameKo: String!
  nameMn: String
  level: GuideLevel
  status: GuideStatus
  gender: GuideGender
  birthYear: Int
  isSmoker: Boolean
  experienceYears: Int
  joinYear: Int
  phone: String
  profileImageUrl: String
  certImageUrls: [String!]
  note: String
}

input GuideUpdateInput {
  nameKo: String
  nameMn: String
  level: GuideLevel
  status: GuideStatus
  gender: GuideGender
  birthYear: Int
  isSmoker: Boolean
  experienceYears: Int
  joinYear: Int
  phone: String
  profileImageUrl: String
  certImageUrls: [String!]
  note: String
}

extend type Query {
  leaderstepsAuthUsers: [LeaderstepsAuthUser!]!
  guideLocations(date: String!, guideId: ID): [GuideLocation!]!
}

extend type Mutation {
  uploadGuideProfileImage(id: ID!, image: Upload!): Guide!
  uploadGuideCertImages(id: ID!, images: [Upload!]!): Guide!
  removeGuideCertImage(id: ID!, imageUrl: String!): Guide!
  linkGuideLeaderstepsAuth(guideId: ID!, authUserId: ID!): Guide!
  unlinkGuideLeaderstepsAuth(guideId: ID!): Guide!
}
