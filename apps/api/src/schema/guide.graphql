enum GuideLevel {
  MAIN
  JUNIOR
  ROOKIE
  OTHER
}

enum GuideStatus {
  ACTIVE_SEASON
  INTERVIEW_DONE
  INACTIVE
  OTHER
}

enum GuideGender {
  MALE
  FEMALE
}

type Guide {
  id: ID!
  nameKo: String!
  nameMn: String
  level: GuideLevel!
  status: GuideStatus!
  gender: GuideGender
  birthYear: Int
  isSmoker: Boolean!
  experienceYears: Int
  joinYear: Int
  phone: String
  profileImageUrl: String
  certImageUrls: [String!]!
  note: String
  leaderstepsAuthUserId: ID
  leaderstepsAuthLinkedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  confirmedTrips(includeCancelled: Boolean): [ConfirmedTrip!]!
}

type LeaderstepsAuthUser {
  id: ID!
  email: String
  phone: String
  displayName: String
  createdAt: DateTime!
  lastSignInAt: DateTime
  linkedGuideId: ID
  linkedGuideNameKo: String
  linkedGuideNameMn: String
}

type GuideLocationPoint {
  latitude: Float!
  longitude: Float!
  accuracy: Float!
  recordedAt: DateTime!
  projectId: ID!
}

type GuidePlaceVisit {
  id: ID!
  projectId: ID!
  centerLatitude: Float!
  centerLongitude: Float!
  startedAt: DateTime!
  endedAt: DateTime!
  durationMs: Int!
  radiusMeters: Float!
  pointCount: Int!
  pinType: String
  description: String
  photoUrls: [String!]!
}

type GuideLiveLocation {
  guideId: ID!
  guideNameKo: String!
  guideNameMn: String
  profileImageUrl: String
  latestLatitude: Float!
  latestLongitude: Float!
  latestAccuracy: Float!
  latestRecordedAt: DateTime!
  path: [GuideLocationPoint!]!
  projectIds: [ID!]!
}

type LeaderstepsActiveProject {
  id: ID!
  name: String!
  startedAt: DateTime!
  scheduledEndedAt: DateTime!
  endedAt: DateTime
  isActive: Boolean!
}

input GuideCreateInput {
  nameKo: String!
  nameMn: String
  level: GuideLevel
  status: GuideStatus
  gender: GuideGender
  birthYear: Int
  isSmoker: Boolean
  experienceYears: Int
  joinYear: Int
  phone: String
  profileImageUrl: String
  certImageUrls: [String!]
  note: String
}

input GuideUpdateInput {
  nameKo: String
  nameMn: String
  level: GuideLevel
  status: GuideStatus
  gender: GuideGender
  birthYear: Int
  isSmoker: Boolean
  experienceYears: Int
  joinYear: Int
  phone: String
  profileImageUrl: String
  certImageUrls: [String!]
  note: String
}

extend type Query {
  leaderstepsAuthUsers: [LeaderstepsAuthUser!]!
  leaderstepsActiveProjects(date: String): [LeaderstepsActiveProject!]!
  guideLiveLocations(projectId: ID, date: String): [GuideLiveLocation!]!
  guidePlaceVisits(guideId: ID!, projectId: ID, date: String): [GuidePlaceVisit!]!
}

extend type Mutation {
  uploadGuideProfileImage(id: ID!, image: Upload!): Guide!
  uploadGuideCertImages(id: ID!, images: [Upload!]!): Guide!
  removeGuideCertImage(id: ID!, imageUrl: String!): Guide!
  linkGuideLeaderstepsAuth(guideId: ID!, authUserId: ID!): Guide!
  unlinkGuideLeaderstepsAuth(guideId: ID!): Guide!
}
