enum ConfirmationDocumentStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
}

type ConfirmationTraveler {
  name: String!
  gender: String
  birthCode: String
  note: String
}

type ConfirmationAppendixPlanStopRow {
  dateCellText: String!
  destinationCellText: String!
  timeCellText: String!
  scheduleCellText: String!
  lodgingCellText: String!
  mealCellText: String!
  movementIntensityColorOverride: String
}

type ConfirmationDocumentSnapshot {
  leaderName: String!
  documentNumber: String
  destination: String!
  headcountText: String!
  travelPeriodText: String!
  vehicleType: String!
  flightInText: String!
  flightOutText: String!
  pickupText: String!
  dropText: String!
  externalPickupDropText: String!
  specialNote: String!
  rentalItemsText: String!
  eventNames: String!
  remark: String!
  balancePerPersonText: String!
  guideName: String!
  meetingPlace: String!
  travelers: [ConfirmationTraveler!]!
  accommodationLines: [String!]!
  appendixPlanStops: [ConfirmationAppendixPlanStopRow!]
  sourcePlanVersionId: ID
  overallMovementIntensityColorOverride: String
}

input ConfirmationAppendixPlanStopRowInput {
  dateCellText: String!
  destinationCellText: String!
  timeCellText: String!
  scheduleCellText: String!
  lodgingCellText: String!
  mealCellText: String!
  movementIntensityColorOverride: String
}

input ConfirmationTravelerInput {
  name: String!
  gender: String
  birthCode: String
  note: String
}

input ConfirmationDocumentSnapshotInput {
  leaderName: String!
  documentNumber: String
  destination: String!
  headcountText: String!
  travelPeriodText: String!
  vehicleType: String!
  flightInText: String!
  flightOutText: String!
  pickupText: String!
  dropText: String!
  externalPickupDropText: String
  specialNote: String
  rentalItemsText: String
  eventNames: String
  remark: String
  balancePerPersonText: String!
  guideName: String
  meetingPlace: String!
  travelers: [ConfirmationTravelerInput!]!
  accommodationLines: [String!]!
  appendixPlanStops: [ConfirmationAppendixPlanStopRowInput!]
  sourcePlanVersionId: ID
  overallMovementIntensityColorOverride: String
}

type ConfirmationDocumentMemo {
  content: String!
  updatedByEmployeeId: ID
  updatedByEmployee: Employee
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ConfirmationDocument {
  id: ID!
  confirmedTripId: ID!
  planVersionId: ID
  documentNumber: String
  versionNumber: Int!
  status: ConfirmationDocumentStatus!
  snapshot: ConfirmationDocumentSnapshot!
  memo: ConfirmationDocumentMemo
  publishedAt: DateTime
  publishedByEmployeeId: ID
  createdByEmployeeId: ID
  updatedByEmployeeId: ID
  publishedByEmployee: Employee
  createdByEmployee: Employee
  updatedByEmployee: Employee
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ConfirmationDraftDefaults {
  confirmedTripId: ID!
  planVersionId: ID
  documentNumber: String
  snapshot: ConfirmationDocumentSnapshot!
}

input SaveConfirmationDocumentInput {
  confirmedTripId: ID!
  snapshot: ConfirmationDocumentSnapshotInput!
  publish: Boolean
}

input SaveConfirmationDocumentMemoInput {
  confirmationDocumentId: ID!
  content: String!
}
