type LocationGuide {
  id: ID!
  title: String!
  description: String!
  imageUrls: [String!]!
  locationId: String
  location: Location
  createdAt: DateTime!
  updatedAt: DateTime!
}

input LocationGuideCreateInput {
  title: String!
  description: String
  images: [Upload!]!
  locationIds: [ID!]!
}

input LocationGuideUpdateInput {
  title: String
  description: String
  images: [Upload!]
  locationId: String
}

input BulkApplyLocationGuideImageByAnchorInput {
  anchorToken: String!
  locationIds: [ID!]!
  image: Upload!
  createGuideIfMissing: Boolean!
  titleForNewGuide: String
  descriptionForNewGuide: String
}

type AppliedAnchorImageLocation {
  locationId: ID!
  guideId: ID!
  lineIndex: Int!
}

type SkippedAnchorImageLocation {
  locationId: ID!
  reason: String!
}

type BulkApplyLocationGuideImageByAnchorPayload {
  applied: [AppliedAnchorImageLocation!]!
  skipped: [SkippedAnchorImageLocation!]!
}

extend type Mutation {
  bulkApplyLocationGuideImageByAnchor(
    input: BulkApplyLocationGuideImageByAnchorInput!
  ): BulkApplyLocationGuideImageByAnchorPayload!
}
