type MovementIntensityColorSetting {
  level: MovementIntensity!
  color: String!
}

type RentalItemPresetItem {
  id: String!
  label: String!
  unit: String!
  quantityFormula: String!
}

type RentalItemSharedQuantityRule {
  id: String!
  minHeadcount: Int!
  maxHeadcount: Int
  quantity: Int!
}

type RentalItemPreset {
  id: String!
  name: String!
  current: Boolean!
  sharedQuantityRules: [RentalItemSharedQuantityRule!]!
  items: [RentalItemPresetItem!]!
}

type AppSettings {
  movementIntensityColors: [MovementIntensityColorSetting!]!
  rentalItemPresets: [RentalItemPreset!]!
  updatedAt: DateTime!
}

input MovementIntensityColorSettingInput {
  level: MovementIntensity!
  color: String!
}

input RentalItemPresetItemInput {
  id: String!
  label: String!
  unit: String!
  quantityFormula: String!
}

input RentalItemSharedQuantityRuleInput {
  id: String!
  minHeadcount: Int!
  maxHeadcount: Int
  quantity: Int!
}

input RentalItemPresetInput {
  id: String!
  name: String!
  current: Boolean!
  sharedQuantityRules: [RentalItemSharedQuantityRuleInput!]!
  items: [RentalItemPresetItemInput!]!
}

input AppSettingsInput {
  movementIntensityColors: [MovementIntensityColorSettingInput!]!
  rentalItemPresets: [RentalItemPresetInput!]!
}

extend type Query {
  appSettings: AppSettings!
}

extend type Mutation {
  updateAppSettings(input: AppSettingsInput!): AppSettings!
}
