enum CatalogPlaceType {
  LODGING
  RESTAURANT
  EXPERIENCE
  MEETING
  GATE
  AREA
}

enum CatalogVisitJudgmentType {
  PASS
  STAY
}

enum CatalogUsageStatus {
  ACTIVE
  INACTIVE
}

enum CatalogElementComposition {
  SINGLE
  SET
}

enum CatalogElementKind {
  MEETING
  TRANSFER
  MEAL
  EXPERIENCE
  MIXED
}

enum CatalogBlockShape {
  DAY
  SET
}

type CatalogRegion {
  id: ID!
  code: String!
  name: String!
  country: String!
  description: String
  status: CatalogUsageStatus!
  sortOrder: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CatalogAccommodationSummary {
  id: ID!
  name: String!
  region: String
  destination: String
}

type CatalogPlace {
  id: ID!
  code: String!
  name: String!
  placeType: CatalogPlaceType!
  country: String!
  regionId: ID
  region: CatalogRegion
  parentPlaceId: ID
  parentPlace: CatalogPlace
  latitude: Float
  longitude: Float
  lodgingLevel: String
  rateSummary: String
  linkLabel: String
  displayName: String
  internalNote: String
  accommodationId: ID
  accommodation: CatalogAccommodationSummary
  visitJudgmentType: CatalogVisitJudgmentType
  visitRadiusM: Int
  visitMinStayMinutes: Int
  status: CatalogUsageStatus!
  sortOrder: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CatalogRoute {
  id: ID!
  code: String!
  name: String!
  regionId: ID
  region: CatalogRegion
  fromPlaceId: ID!
  fromPlace: CatalogPlace!
  toPlaceId: ID!
  toPlace: CatalogPlace!
  averageDistanceKm: Float
  averageTravelHours: Float
  status: CatalogUsageStatus!
  sortOrder: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CatalogElementItem {
  id: ID!
  setElementId: ID!
  memberElementId: ID!
  memberElement: CatalogElement!
  orderIndex: Int!
}

type CatalogElement {
  id: ID!
  code: String!
  name: String!
  version: Int!
  composition: CatalogElementComposition!
  kind: CatalogElementKind!
  defaultPlaceId: ID
  defaultPlace: CatalogPlace
  defaultPlaceMode: String
  durationText: String
  costRuleText: String
  customerText: String
  valueStatusText: String!
  lifecycleStatus: String!
  usageCount: Int!
  status: CatalogUsageStatus!
  sortOrder: Int!
  setItems: [CatalogElementItem!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CatalogBlockItem {
  id: ID!
  setBlockId: ID!
  memberBlockId: ID!
  memberBlock: CatalogBlock!
  orderIndex: Int!
}

type CatalogBlockPlacement {
  id: ID!
  blockId: ID!
  elementId: ID!
  element: CatalogElement!
  dayIndex: Int!
  orderIndex: Int!
  startLabel: String
}

type CatalogBlock {
  id: ID!
  code: String!
  name: String!
  version: Int!
  shape: CatalogBlockShape!
  dayCount: Int!
  fromLabel: String
  toLabel: String
  compositionText: String
  distanceKm: Float
  travelHours: Float
  timeSaturationPct: Int
  timeSaturationText: String
  fatigueScore: Float
  estimatedCostText: String
  calcStatusText: String!
  usageCount: Int!
  status: CatalogUsageStatus!
  sortOrder: Int!
  setItems: [CatalogBlockItem!]!
  placements: [CatalogBlockPlacement!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CatalogJourneyPlacement {
  id: ID!
  journeyId: ID!
  blockId: ID!
  block: CatalogBlock!
  orderIndex: Int!
  dayOffset: Int!
}

type CatalogJourney {
  id: ID!
  code: String!
  name: String!
  version: Int!
  nightCount: Int!
  dayCount: Int!
  calcStatusText: String!
  status: CatalogUsageStatus!
  sortOrder: Int!
  placements: [CatalogJourneyPlacement!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CatalogChangeLog {
  id: ID!
  actorLabel: String!
  targetType: String!
  targetId: ID!
  action: String!
  summary: String!
  createdAt: DateTime!
}

type CatalogUsageRef {
  id: ID!
  kind: String!
  name: String!
  code: String!
}

type CatalogBatchResult {
  id: ID
  ok: Boolean!
  message: String
}

input CatalogRegionCreateInput {
  name: String!
  country: String
  description: String
  status: CatalogUsageStatus
}

input CatalogRegionUpdateInput {
  name: String
  country: String
  description: String
  status: CatalogUsageStatus
}

input CatalogPlaceCreateInput {
  name: String!
  placeType: CatalogPlaceType!
  country: String
  regionId: ID
  parentPlaceId: ID
  latitude: Float
  longitude: Float
  displayName: String
  internalNote: String
  accommodationId: ID
  visitJudgmentType: CatalogVisitJudgmentType
  visitRadiusM: Int
  visitMinStayMinutes: Int
  status: CatalogUsageStatus
}

input CatalogPlaceUpdateInput {
  name: String
  placeType: CatalogPlaceType
  country: String
  regionId: ID
  parentPlaceId: ID
  latitude: Float
  longitude: Float
  displayName: String
  internalNote: String
  accommodationId: ID
  visitJudgmentType: CatalogVisitJudgmentType
  visitRadiusM: Int
  visitMinStayMinutes: Int
  status: CatalogUsageStatus
}

input CatalogRouteCreateInput {
  name: String!
  fromPlaceId: ID!
  toPlaceId: ID!
  regionId: ID
  averageDistanceKm: Float
  averageTravelHours: Float
  status: CatalogUsageStatus
}

input CatalogRouteUpdateInput {
  name: String
  fromPlaceId: ID
  toPlaceId: ID
  regionId: ID
  averageDistanceKm: Float
  averageTravelHours: Float
  status: CatalogUsageStatus
}

input CatalogElementCreateInput {
  name: String!
  kind: CatalogElementKind!
  composition: CatalogElementComposition
  customerText: String
  durationText: String
  costRuleText: String
  defaultPlaceId: ID
  lifecycleStatus: String
  status: CatalogUsageStatus
}

input CatalogElementUpdateInput {
  name: String
  kind: CatalogElementKind
  composition: CatalogElementComposition
  customerText: String
  durationText: String
  costRuleText: String
  defaultPlaceId: ID
  lifecycleStatus: String
  status: CatalogUsageStatus
}

input CatalogElementSetItemInput {
  setElementId: ID!
  memberElementId: ID!
}

input CatalogBlockCreateInput {
  name: String!
  shape: CatalogBlockShape
  dayCount: Int
  fromLabel: String
  toLabel: String
  status: CatalogUsageStatus
}

input CatalogBlockUpdateInput {
  name: String
  dayCount: Int
  fromLabel: String
  toLabel: String
  status: CatalogUsageStatus
}

input CatalogBlockPlacementInput {
  blockId: ID!
  elementId: ID!
  dayIndex: Int
  startLabel: String
}

input CatalogJourneyCreateInput {
  name: String!
  nightCount: Int
  dayCount: Int
  status: CatalogUsageStatus
}

input CatalogJourneyUpdateInput {
  name: String
  nightCount: Int
  dayCount: Int
  status: CatalogUsageStatus
}

input CatalogJourneyPlacementInput {
  journeyId: ID!
  blockId: ID!
  dayOffset: Int
}

input CatalogPlaceBatchUpdateInput {
  ids: [ID!]!
  status: CatalogUsageStatus
  regionId: ID
}

extend type Query {
  catalogRegions(status: CatalogUsageStatus): [CatalogRegion!]!
  catalogPlaces(status: CatalogUsageStatus, placeType: CatalogPlaceType): [CatalogPlace!]!
  catalogRoutes(status: CatalogUsageStatus): [CatalogRoute!]!
  catalogElements(status: CatalogUsageStatus): [CatalogElement!]!
  catalogBlocks(status: CatalogUsageStatus): [CatalogBlock!]!
  catalogJourneys(status: CatalogUsageStatus): [CatalogJourney!]!
  catalogElementUsages(elementId: ID!): [CatalogUsageRef!]!
  catalogChangeLogs(targetType: String, targetId: ID): [CatalogChangeLog!]!
}

extend type Mutation {
  createCatalogRegion(input: CatalogRegionCreateInput!): CatalogRegion!
  updateCatalogRegion(id: ID!, input: CatalogRegionUpdateInput!): CatalogRegion!
  createCatalogPlace(input: CatalogPlaceCreateInput!): CatalogPlace!
  updateCatalogPlace(id: ID!, input: CatalogPlaceUpdateInput!): CatalogPlace!
  createCatalogRoute(input: CatalogRouteCreateInput!): CatalogRoute!
  updateCatalogRoute(id: ID!, input: CatalogRouteUpdateInput!): CatalogRoute!
  createCatalogElement(input: CatalogElementCreateInput!): CatalogElement!
  updateCatalogElement(id: ID!, input: CatalogElementUpdateInput!): CatalogElement!
  addCatalogElementSetItem(input: CatalogElementSetItemInput!): CatalogElement!
  removeCatalogElementSetItem(id: ID!): CatalogElement!
  createCatalogBlock(input: CatalogBlockCreateInput!): CatalogBlock!
  updateCatalogBlock(id: ID!, input: CatalogBlockUpdateInput!): CatalogBlock!
  addCatalogBlockDay(id: ID!): CatalogBlock!
  addCatalogBlockPlacement(input: CatalogBlockPlacementInput!): CatalogBlock!
  removeCatalogBlockPlacement(id: ID!): CatalogBlock!
  createCatalogJourney(input: CatalogJourneyCreateInput!): CatalogJourney!
  updateCatalogJourney(id: ID!, input: CatalogJourneyUpdateInput!): CatalogJourney!
  addCatalogJourneyPlacement(input: CatalogJourneyPlacementInput!): CatalogJourney!
  removeCatalogJourneyPlacement(id: ID!): CatalogJourney!
  batchUpdateCatalogPlaces(input: CatalogPlaceBatchUpdateInput!): [CatalogBatchResult!]!
}
