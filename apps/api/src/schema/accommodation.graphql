enum AccommodationLevel {
  LV2
  LV3
  LV4
  LV5
}

enum PaymentMethod {
  PER_PERSON
  PER_ROOM
}

enum AccommodationPriceCurrencyCode {
  MNT
  USD
}

type Accommodation {
  id: ID!
  name: String!
  destination: String!
  region: String!
  coverImageUrl: String
  phone: String
  facilities: String
  bookingMethod: String
  bookingPriority: String
  openingDate: String
  closingDate: String
  options: [AccommodationOption!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AccommodationOption {
  id: ID!
  accommodationId: ID!
  accommodation: Accommodation!
  roomType: String!
  level: AccommodationLevel!
  priceOffSeason: Int
  pricePeakSeason: Int
  priceCurrencyCode: AccommodationPriceCurrencyCode!
  paymentMethod: PaymentMethod
  mealCostPerServing: Int
  capacity: Int
  mealIncluded: Boolean!
  googleMapsUrl: String
  imageUrls: [String!]!
  note: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

input AccommodationCreateInput {
  name: String!
  destination: String!
  region: String!
  phone: String
  facilities: String
  bookingMethod: String
  bookingPriority: String
  openingDate: String
  closingDate: String
}

input AccommodationUpdateInput {
  name: String
  destination: String
  region: String
  coverImageUrl: String
  phone: String
  facilities: String
  bookingMethod: String
  bookingPriority: String
  openingDate: String
  closingDate: String
}

input AccommodationOptionCreateInput {
  accommodationId: ID!
  roomType: String!
  level: AccommodationLevel
  priceOffSeason: Int
  pricePeakSeason: Int
  priceCurrencyCode: AccommodationPriceCurrencyCode
  paymentMethod: PaymentMethod
  mealCostPerServing: Int
  capacity: Int
  mealIncluded: Boolean
  googleMapsUrl: String
  imageUrls: [String!]
  note: String
}

input AccommodationOptionUpdateInput {
  roomType: String
  level: AccommodationLevel
  priceOffSeason: Int
  pricePeakSeason: Int
  priceCurrencyCode: AccommodationPriceCurrencyCode
  paymentMethod: PaymentMethod
  mealCostPerServing: Int
  capacity: Int
  mealIncluded: Boolean
  googleMapsUrl: String
  imageUrls: [String!]
  note: String
}

extend type Mutation {
  # 대표 사진(coverImageUrl) 한 장만 업로드. images는 길이 1. 객실 옵션 앨범은 uploadAccommodationOptionImages 사용.
  uploadAccommodationImages(accommodationId: ID!, images: [Upload!]!): Accommodation!
  uploadAccommodationOptionImages(id: ID!, images: [Upload!]!): AccommodationOption!
  removeAccommodationOptionImage(id: ID!, imageUrl: String!): AccommodationOption!
}
